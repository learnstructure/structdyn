[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structdyn"
version = "0.8.0"
description = "StructDyn: An open-source Python library for structural dynamics analysis."
authors = [
    { name="Abinash Mandal", email="abinashmandal33486@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/learnstructure/structdyn"
Documentation = "https://structdyn.readthedocs.io/en/latest/"
Issues = "https://github.com/learnstructure/structdyn/issues"
Changelog = "https://github.com/learnstructure/structdyn/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
exclude = ["tests"]
