name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install structdyn with the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run the test suite
        run: pytest -v -rs tests

  integration:
    name: Integration with fem2d, struct_core, and struct_load
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install structdyn and the optional packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pip install git+https://github.com/learnstructure/struct_core
          python -m pip install git+https://github.com/learnstructure/struct_load
          python -m pip install git+https://github.com/learnstructure/fem-2d

      - name: Run the full test suite without skips
        shell: bash
        run: |
          pytest -v -rs tests | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then echo "Integration tests were skipped"; exit 1; fi
